name: Run Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.12'

    - name: Install apt dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglx-mesa0

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        # Install the project so the dependency set comes from pyproject.toml.
        # -U with --upgrade-strategy eager matters for `act`: its runner image
        # reuses a hostedtoolcache directory across local runs, and pip's
        # default upgrade strategy only upgrades a package already satisfying
        # an unconstrained requirement (teleprox, most often) if something on
        # the command line needs a newer one -- never a transitive dependency
        # left over, stale, from a previous local run. A real GitHub-hosted
        # runner starts with nothing installed, so this is a no-op there.
        pip install -U --upgrade-strategy eager -e .
        # pytest is the only test-time addition, since it is not a runtime
        # dependency of the package.
        pip install -U pytest pytest-qt

    - name: Run tests
      env:
        # The runner has no display, so Qt must use the offscreen platform
        # plugin; without it QGuiApplication aborts while creating its platform
        # integration and pytest dies with a core dump.
        QT_QPA_PLATFORM: offscreen
      run: |
        python -m pytest
