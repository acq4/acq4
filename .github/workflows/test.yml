name: Run Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.12'

    - name: Install apt dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglx-mesa0

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        # Install the project so the dependency set comes from pyproject.toml.
        # pytest is the only test-time addition, since it is not a runtime
        # dependency of the package.
        pip install -e .
        pip install -U pytest pytest-qt

    - name: Run tests
      env:
        # The runner has no display, so Qt must use the offscreen platform
        # plugin; without it QGuiApplication aborts while creating its platform
        # integration and pytest dies with a core dump.
        QT_QPA_PLATFORM: offscreen
        # acq4 targets PyQt5, but pytest-qt and pyqtgraph each auto-detect a
        # binding and both prefer PyQt6/PySide6 whenever those merely happen to
        # be importable. Pin them so the suite always exercises the binding acq4
        # declares, whatever else is present in the environment. These are
        # environment variables rather than pytest ini options so they also
        # reach the subprocesses that the teleprox-based tests spawn, which get
        # no pytest configuration of their own.
        PYTEST_QT_API: pyqt5
        PYQTGRAPH_QT_LIB: PyQt5
      run: |
        python -m pytest
